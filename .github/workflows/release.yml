name: Publish Server Manager
run-name: Server Manager release from VERSION

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      draft:
        description: Keep the release as a draft
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: server-manager-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore Briefcase.ServerManager.slnx --locked-mode
      - name: Build and test
        run: |
          dotnet build Briefcase.ServerManager.slnx -c Release --no-restore
          dotnet run --project tests/Briefcase.ServerManager.Contracts -c Release --no-build
      - name: Publish Native AOT
        run: ./scripts/Publish-SingleFile.ps1 -Platform windows-x64 -NoRestore
      - name: Test single-file bootstrap
        run: ./artifacts/publish/windows-x64/Briefcase.ServerManager.exe --bootstrap-self-test
      - name: Package
        run: ./scripts/Package.ps1 -PublishDirectory artifacts/publish/windows-x64 -Platform windows-x64
      - name: Upload Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-manager-windows
          path: artifacts/release/*.zip
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: server-manager-*
          path: artifacts/release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists" >&2
            exit 1
          fi
          draft=()
          [[ "$RELEASE_DRAFT" == "true" ]] && draft=(--draft)
          gh release create "v$version" artifacts/release/*.zip --target "$GITHUB_SHA" \
            --title "Briefcase Server Manager $version" --generate-notes "${draft[@]}"
